<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AT FARM">
  <title>AT FARM</title>
  <link rel="manifest" href="./manifest.webmanifest?v=10.92">
  <link rel="icon" href="./icon-192.png?v=10.92">
  <link rel="apple-touch-icon" href="./icon-192.png?v=10.92">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;background:#fff}
    #atfarm-root{position:fixed;inset:0;width:100vw;height:100dvh;margin:0;padding:0;overflow:hidden;background:#fff}
    #atfarm-frame{display:block;width:100%;height:100%;margin:0;padding:0;border:0;background:#fff}
    .setup{font-family:Arial,sans-serif;padding:24px;color:#173b28}
  </style>
</head>
<body>
  <main id="atfarm-root"></main>
  <script src="./config.js?v=10.92"></script>
  <script>
  (() => {
    const root = document.getElementById('atfarm-root');
    const url = window.AT_FARM_WEB_APP_URL || '';
    if (!url) {
      root.innerHTML = '<div class="setup"><h2>AT FARM</h2><p>URL Web App belum diatur.</p></div>';
      return;
    }
    const frame = document.createElement('iframe');
    frame.id = 'atfarm-frame';
    frame.src = url;
    frame.title = 'AT FARM';
    frame.allow = 'clipboard-read; clipboard-write';
    root.replaceChildren(frame);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js?v=10.92', {scope:'./', updateViaCache:'none'});
          await reg.update();
        } catch (err) { console.error(err); }
      });
    }
  })();
  </script>
</body>
</html>
